name: CopyNotebook
options:
  bundleIdPrefix: com.copynotebook
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  CopyNotebook:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: CopyNotebook
    info:
      path: CopyNotebook/Info.plist
    entitlements:
      path: CopyNotebook/CopyNotebook.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.copynotebook.app
        PRODUCT_NAME: コピペ帳
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: CopyNotebookWidgetExtension
        embed: true
      - target: CopyNotebookKeyboardExtension
        embed: true

  CopyNotebookWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: CopyNotebookWidget
    info:
      path: CopyNotebookWidget/Info.plist
    entitlements:
      path: CopyNotebookWidget/CopyNotebookWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.copynotebook.app.widget
        PRODUCT_NAME: コピペ帳ウィジェット
        TARGETED_DEVICE_FAMILY: "1,2"

  CopyNotebookKeyboardExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: CopyNotebookKeyboard
    info:
      path: CopyNotebookKeyboard/Info.plist
    entitlements:
      path: CopyNotebookKeyboard/CopyNotebookKeyboard.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.copynotebook.app.keyboard
        PRODUCT_NAME: コピペ帳キーボード
        # Info.plist's NSExtensionPrincipalClass is "$(PRODUCT_MODULE_NAME).KeyboardViewController";
        # pin an ASCII module name so it doesn't depend on how the Japanese product name is mangled.
        PRODUCT_MODULE_NAME: CopyNotebookKeyboard
        TARGETED_DEVICE_FAMILY: "1,2"
