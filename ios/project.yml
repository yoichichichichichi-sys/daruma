name: CopyNotebook
options:
  bundleIdPrefix: com.copynotebook
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  CopyNotebook:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: CopyNotebook
    info:
      path: CopyNotebook/Info.plist
    entitlements:
      path: CopyNotebook/CopyNotebook.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.copynotebook.app
        PRODUCT_NAME: コピペ帳
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: CopyNotebookWidgetExtension
        embed: true

  CopyNotebookWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: CopyNotebookWidget
    info:
      path: CopyNotebookWidget/Info.plist
    entitlements:
      path: CopyNotebookWidget/CopyNotebookWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.copynotebook.app.widget
        PRODUCT_NAME: コピペ帳ウィジェット
        TARGETED_DEVICE_FAMILY: "1,2"
