<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>動画URL帳</title>
<meta name="description" content="動画やサイトのURLを保存して、サムネイル付きで見返せるアプリ" />
<meta name="theme-color" content="#4f6df5" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="app-header">
  <h1>🎬 動画URL帳</h1>
  <p class="subtitle">動画やサイトのURLを保存して、サムネイルでサッと見返せます</p>
</header>

<main class="container">
  <section class="input-area">
    <input id="new-url" type="url" inputmode="url" placeholder="https://... のURLを貼り付け" />
    <div class="input-actions">
      <button id="add-btn" class="btn btn-primary">保存</button>
      <button id="read-clipboard-btn" class="btn btn-secondary">クリップボードから読み込む</button>
      <label class="watch-toggle">
        <input type="checkbox" id="watch-toggle" />
        自動監視
      </label>
    </div>
    <p class="hint">
      YouTubeアプリ等の「共有」→「動画URL帳」を選ぶと、ボタン一つで自動保存できます。
    </p>
  </section>

  <section class="toolbar">
    <input type="search" id="search-box" placeholder="タイトル・サイト名・URLで検索..." />
    <div class="view-toggle" role="group" aria-label="表示切替">
      <button id="view-grid-btn" class="view-btn active" title="グリッド表示">▦</button>
      <button id="view-list-btn" class="view-btn" title="リスト表示">☰</button>
    </div>
    <button id="clear-all-btn" class="btn btn-danger">すべて削除</button>
  </section>

  <section class="history-section">
    <ul id="item-grid" class="item-grid"></ul>
    <p id="empty-message" class="empty-message" hidden>
      まだ保存したURLがありません。<br />動画やサイトのリンクを貼り付けてみましょう。
    </p>
  </section>
</main>

<div id="toast" class="toast" hidden></div>

<div id="detail-modal" class="modal" hidden>
  <div class="modal-backdrop"></div>
  <div class="modal-card">
    <img id="detail-thumb" class="modal-thumb" alt="" />
    <h3 id="detail-title" class="modal-title"></h3>
    <p id="detail-site" class="modal-site"></p>
    <p id="detail-url" class="modal-url"></p>
    <div class="modal-actions">
      <a id="detail-open" class="btn btn-primary" target="_blank" rel="noopener">開く</a>
      <button id="detail-copy" class="btn btn-secondary">URLをコピー</button>
      <button id="detail-delete" class="btn btn-danger">削除</button>
      <button id="detail-close" class="btn">閉じる</button>
    </div>
  </div>
</div>

<template id="card-template">
  <li class="item-card" data-id="">
    <button class="item-thumb-btn">
      <img class="item-thumb" loading="lazy" alt="" />
      <span class="item-kind-badge"></span>
    </button>
    <div class="item-info">
      <p class="item-title"></p>
      <p class="item-site"></p>
    </div>
  </li>
</template>

<script src="app.js"></script>
</body>
</html>
